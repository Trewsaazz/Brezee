name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild Brezee.sln -restore -m -p:Configuration=${{ matrix.configuration }} -p:Platform=x64 "-flp:ErrorsOnly;LogFile=msbuild-errors.log"

      # Turn MSBuild errors into annotations so failures are readable without opening the full log.
      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path msbuild-errors.log) {
            Get-Content msbuild-errors.log | Where-Object { $_.Trim() } | Select-Object -Unique -First 50 |
              ForEach-Object { Write-Output "::error::$_" }
          }

      - name: Upload app
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Brezee-win-x64
          path: src/Brezee.App/bin/x64/Release/net10.0-windows/
          if-no-files-found: error
