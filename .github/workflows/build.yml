name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild Brezee.sln -restore -m -p:Configuration=${{ matrix.configuration }} -p:Platform=x64 "-flp1:ErrorsOnly;LogFile=msbuild-errors.log" "-flp2:WarningsOnly;LogFile=msbuild-warnings.log"

      # Turn MSBuild errors and warnings into annotations so they are readable without opening the full log.
      - name: Report build diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($entry in @(@{ File = 'msbuild-errors.log'; Level = 'error' }, @{ File = 'msbuild-warnings.log'; Level = 'warning' })) {
            if (Test-Path $entry.File) {
              Get-Content $entry.File | Where-Object { $_.Trim() } | Select-Object -Unique -First 50 |
                ForEach-Object { Write-Output "::$($entry.Level)::$_" }
            }
          }

      - name: Run tests
        shell: pwsh
        run: ./eng/run-tests.ps1 -Configuration ${{ matrix.configuration }}

      - name: Upload app
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Brezee-win-x64
          path: src/Brezee.App/bin/x64/Release/net10.0-windows/
          if-no-files-found: error
